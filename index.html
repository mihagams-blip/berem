<!doctype html>
<html lang="sl">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <!-- Namizna aplikacija (PWA). Na iPhonu je ključna `apple-touch-icon`: brez
         nje iOS na namizje postavi kar posnetek strani. Manifest sam za ikono na
         iOS ne zadošča, na Androidu pa je obratno — zato oboje. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="BEREM" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#8FD3FF" />
    <link rel="apple-touch-icon" href="./icons/icon-180.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>BEREM</title>
    <link rel="preload" as="font" type="font/woff2" href="./fonts/fredoka-var-latin.woff2" crossorigin />
    <style>
      /* Fredoka je postrežena lokalno — brez Google CDN, da igra dela tudi brez omrežja
         in da se pisava ne zamenja sredi branja. Oba obsega sta potrebna: latin-ext nosi Č Š Ž. */
      @font-face {
        font-family: 'Fredoka';
        src: url('./fonts/fredoka-var-latin-ext.woff2') format('woff2');
        font-weight: 400 700;
        font-display: swap;
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF,
          U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB,
          U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      @font-face {
        font-family: 'Fredoka';
        src: url('./fonts/fredoka-var-latin.woff2') format('woff2');
        font-weight: 400 700;
        font-display: swap;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
          U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215,
          U+FEFF, U+FFFD;
      }
      html,
      body,
      #root {
        margin: 0;
        padding: 0;
        min-height: 100%;
      }
      body {
        /* Otrok igra s prstom: brez dvojnega tapa za zoom, brez potega za osvežitev. */
        touch-action: manipulation;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
        background: #8fd3ff;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
